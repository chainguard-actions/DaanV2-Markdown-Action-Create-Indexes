name: Test missing folder error handling
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          folder: "${{ github.workspace }}/nonexistent-folder-xyz"
          filename: index.md
        continue-on-error: true

      - name: Assert action failed for missing folder
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when folder does not exist, got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed for missing folder"

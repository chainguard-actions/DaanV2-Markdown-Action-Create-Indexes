name: Test content file inclusion
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up test wiki folder with content file
        run: |
          mkdir -p "$GITHUB_WORKSPACE/wiki-content"
          echo "This is the section description." > "$GITHUB_WORKSPACE/wiki-content/.content.md"
          echo "# Article One" > "$GITHUB_WORKSPACE/wiki-content/article-one.md"
          echo "# Article Two" > "$GITHUB_WORKSPACE/wiki-content/article-two.md"

      - id: action
        uses: .
        with:
          folder: "${{ github.workspace }}/wiki-content"
          filename: index.md
          content: .content.md

      - name: Assert index.md was created
        run: |
          INDEX="$GITHUB_WORKSPACE/wiki-content/index.md"
          if [ ! -f "$INDEX" ]; then
            echo "FAIL: index.md was not created"
            exit 1
          fi
          echo "PASS: index.md exists"

      - name: Assert index.md contains content from .content.md
        run: |
          INDEX="$GITHUB_WORKSPACE/wiki-content/index.md"
          echo "--- index.md contents ---"
          cat "$INDEX"
          echo "--- end ---"
          if ! grep -q "This is the section description" "$INDEX"; then
            echo "FAIL: index.md does not contain content from .content.md"
            exit 1
          fi
          echo "PASS: index.md contains content from .content.md"

      - name: Assert .content.md itself is not linked in the index
        run: |
          INDEX="$GITHUB_WORKSPACE/wiki-content/index.md"
          if grep -q "\.content\.md" "$INDEX"; then
            echo "FAIL: .content.md should be excluded from document links"
            exit 1
          fi
          echo "PASS: .content.md is not linked in the index"

name: Test content file inclusion
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up markdown folder structure with content file
        run: |
          mkdir -p "$GITHUB_WORKSPACE/mywiki/topic"
          echo "# Guide" > "$GITHUB_WORKSPACE/mywiki/topic/guide.md"
          echo "# Reference" > "$GITHUB_WORKSPACE/mywiki/topic/reference.md"
          # Create a .content.md file with extra content to be embedded
          echo "This is the topic overview content." > "$GITHUB_WORKSPACE/mywiki/topic/.content.md"

      - id: action
        uses: .
        with:
          folder: "${{ github.workspace }}/mywiki"
          filename: index.md
          content: .content.md

      - name: Assert index.md created in topic
        run: |
          if [ ! -f "$GITHUB_WORKSPACE/mywiki/topic/index.md" ]; then
            echo "FAIL: index.md not found in topic"
            exit 1
          fi
          echo "PASS: index.md found in topic"

      - name: Assert index.md includes content from .content.md
        run: |
          CONTENT=$(cat "$GITHUB_WORKSPACE/mywiki/topic/index.md")
          echo "Content of topic/index.md:"
          echo "$CONTENT"
          if ! echo "$CONTENT" | grep -q "topic overview content"; then
            echo "FAIL: index.md does not include content from .content.md"
            exit 1
          fi
          echo "PASS: index.md includes content from .content.md"

      - name: Assert index.md contains document links
        run: |
          CONTENT=$(cat "$GITHUB_WORKSPACE/mywiki/topic/index.md")
          if ! echo "$CONTENT" | grep -q "guide"; then
            echo "FAIL: index.md does not contain link to guide"
            exit 1
          fi
          if ! echo "$CONTENT" | grep -q "reference"; then
            echo "FAIL: index.md does not contain link to reference"
            exit 1
          fi
          echo "PASS: index.md contains expected document links"

      - name: Assert .content.md itself is not listed as a document link
        run: |
          CONTENT=$(cat "$GITHUB_WORKSPACE/mywiki/topic/index.md")
          if echo "$CONTENT" | grep -q "\.content"; then
            echo "FAIL: .content.md should not appear as a document link"
            exit 1
          fi
          echo "PASS: .content.md correctly excluded from document links"

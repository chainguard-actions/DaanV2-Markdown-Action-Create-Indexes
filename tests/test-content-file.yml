name: Test content file - prepend custom content to index
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create test markdown folder with content file
        run: |
          mkdir -p /tmp/test-wiki-content
          echo "# My Custom Header" > /tmp/test-wiki-content/.content.md
          echo "This is a custom description for this section." >> /tmp/test-wiki-content/.content.md
          echo "# Article One" > /tmp/test-wiki-content/article-one.md
          echo "# Article Two" > /tmp/test-wiki-content/article-two.md

      - id: action
        uses: .
        with:
          folder: /tmp/test-wiki-content
          filename: index.md
          content: .content.md

      - name: Assert index file was created
        run: |
          if [ ! -f "/tmp/test-wiki-content/index.md" ]; then
            echo "FAIL: index.md was not created"
            exit 1
          fi
          echo "PASS: index.md exists"

      - name: Assert index contains custom content from .content.md
        run: |
          INDEX_CONTENT=$(cat /tmp/test-wiki-content/index.md)
          echo "Index content:"
          echo "$INDEX_CONTENT"
          if ! echo "$INDEX_CONTENT" | grep -q "My Custom Header"; then
            echo "FAIL: index.md does not contain the custom header from .content.md"
            exit 1
          fi
          echo "PASS: index.md contains custom content from .content.md"

      - name: Assert index contains links to article files
        run: |
          INDEX_CONTENT=$(cat /tmp/test-wiki-content/index.md)
          if ! echo "$INDEX_CONTENT" | grep -q "article-one"; then
            echo "FAIL: index.md does not contain link to article-one"
            exit 1
          fi
          if ! echo "$INDEX_CONTENT" | grep -q "article-two"; then
            echo "FAIL: index.md does not contain link to article-two"
            exit 1
          fi
          echo "PASS: index.md contains links to all articles"

name: Test custom filename - README.md
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up test folder with markdown files
        run: |
          mkdir -p /tmp/wiki-readme-test
          echo "# Getting Started" > /tmp/wiki-readme-test/getting-started.md
          echo "# API Reference" > /tmp/wiki-readme-test/api-reference.md

      - id: action
        uses: .
        with:
          folder: /tmp/wiki-readme-test
          filename: README.md

      - name: Assert README.md was created
        run: |
          if [ ! -f /tmp/wiki-readme-test/README.md ]; then
            echo "FAIL: README.md was not created"
            exit 1
          fi
          echo "PASS: README.md exists"

      - name: Assert index.md was NOT created
        run: |
          if [ -f /tmp/wiki-readme-test/index.md ]; then
            echo "FAIL: index.md should not have been created when filename=README.md"
            exit 1
          fi
          echo "PASS: index.md was not created (correct)"

      - name: Assert README.md contains document links
        run: |
          CONTENT=$(cat /tmp/wiki-readme-test/README.md)
          echo "README.md content:"
          echo "$CONTENT"
          if ! echo "$CONTENT" | grep -q "getting-started"; then
            echo "FAIL: README.md does not contain link to getting-started.md"
            exit 1
          fi
          if ! echo "$CONTENT" | grep -q "api-reference"; then
            echo "FAIL: README.md does not contain link to api-reference.md"
            exit 1
          fi
          echo "PASS: README.md contains all document links"

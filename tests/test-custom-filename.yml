name: Test custom filename
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up markdown folder structure
        run: |
          mkdir -p "$GITHUB_WORKSPACE/docs/section-one"
          echo "# Article A" > "$GITHUB_WORKSPACE/docs/section-one/article-a.md"
          echo "# Article B" > "$GITHUB_WORKSPACE/docs/section-one/article-b.md"

      - id: action
        uses: .
        with:
          folder: "${{ github.workspace }}/docs"
          filename: README.md

      - name: Assert README.md created in section-one (custom filename)
        run: |
          if [ ! -f "$GITHUB_WORKSPACE/docs/section-one/README.md" ]; then
            echo "FAIL: README.md not found in section-one"
            exit 1
          fi
          echo "PASS: README.md found in section-one"

      - name: Assert default index.md was NOT created (custom filename used)
        run: |
          if [ -f "$GITHUB_WORKSPACE/docs/section-one/index.md" ]; then
            echo "FAIL: index.md should not have been created when filename=README.md"
            exit 1
          fi
          echo "PASS: index.md correctly absent"

      - name: Assert root README.md created
        run: |
          if [ ! -f "$GITHUB_WORKSPACE/docs/README.md" ]; then
            echo "FAIL: root README.md not found in docs"
            exit 1
          fi
          echo "PASS: root README.md found in docs"

      - name: Assert README.md contains document links
        run: |
          CONTENT=$(cat "$GITHUB_WORKSPACE/docs/section-one/README.md")
          echo "Content of section-one/README.md:"
          echo "$CONTENT"
          if ! echo "$CONTENT" | grep -q "article-a"; then
            echo "FAIL: README.md does not contain link to article-a"
            exit 1
          fi
          if ! echo "$CONTENT" | grep -q "article-b"; then
            echo "FAIL: README.md does not contain link to article-b"
            exit 1
          fi
          echo "PASS: README.md contains expected document links"

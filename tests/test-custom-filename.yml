name: Test custom filename input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create test markdown folder structure
        run: |
          mkdir -p /tmp/wiki-custom/docs
          echo "# Page One" > /tmp/wiki-custom/docs/page-one.md
          echo "# Page Two" > /tmp/wiki-custom/docs/page-two.md

      - id: action
        uses: .
        with:
          folder: /tmp/wiki-custom/docs
          filename: README.md

      - name: Assert README.md was created (not index.md)
        run: |
          if [ ! -f "/tmp/wiki-custom/docs/README.md" ]; then
            echo "FAIL: README.md was not created"
            exit 1
          fi
          echo "PASS: README.md exists"

      - name: Assert default index.md was NOT created
        run: |
          if [ -f "/tmp/wiki-custom/docs/index.md" ]; then
            echo "FAIL: index.md should not have been created when filename=README.md"
            exit 1
          fi
          echo "PASS: index.md was not created (correct)"

      - name: Assert README.md contains links to markdown files
        run: |
          echo "--- README.md contents ---"
          cat /tmp/wiki-custom/docs/README.md
          echo "--- end ---"
          if ! grep -q "page" /tmp/wiki-custom/docs/README.md; then
            echo "FAIL: README.md does not reference page files"
            exit 1
          fi
          echo "PASS: README.md contains expected content"

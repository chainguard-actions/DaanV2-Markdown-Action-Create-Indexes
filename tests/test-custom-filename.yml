name: Test custom index filename
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up test wiki folder
        run: |
          mkdir -p "$GITHUB_WORKSPACE/wiki-custom"
          echo "# Page One" > "$GITHUB_WORKSPACE/wiki-custom/page-one.md"
          echo "# Page Two" > "$GITHUB_WORKSPACE/wiki-custom/page-two.md"

      - id: action
        uses: .
        with:
          folder: "${{ github.workspace }}/wiki-custom"
          filename: README.md

      - name: Assert README.md was created (not index.md)
        run: |
          README="$GITHUB_WORKSPACE/wiki-custom/README.md"
          INDEX="$GITHUB_WORKSPACE/wiki-custom/index.md"
          if [ ! -f "$README" ]; then
            echo "FAIL: README.md was not created"
            exit 1
          fi
          if [ -f "$INDEX" ]; then
            echo "FAIL: index.md should not have been created when filename=README.md"
            exit 1
          fi
          echo "PASS: README.md created and index.md not created"

      - name: Assert README.md contains document links
        run: |
          README="$GITHUB_WORKSPACE/wiki-custom/README.md"
          echo "--- README.md contents ---"
          cat "$README"
          echo "--- end ---"
          if ! grep -q "page-one" "$README"; then
            echo "FAIL: README.md does not contain link to page-one.md"
            exit 1
          fi
          if ! grep -q "page-two" "$README"; then
            echo "FAIL: README.md does not contain link to page-two.md"
            exit 1
          fi
          echo "PASS: README.md contains expected document links"

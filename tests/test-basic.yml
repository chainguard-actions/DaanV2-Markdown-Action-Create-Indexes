name: Test basic usage - create index.md
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up test folder with markdown files
        run: |
          mkdir -p /tmp/wiki-test
          echo "# Page One" > /tmp/wiki-test/page-one.md
          echo "# Page Two" > /tmp/wiki-test/page-two.md
          echo "# Page Three" > /tmp/wiki-test/page-three.md

      - id: action
        uses: .
        with:
          folder: /tmp/wiki-test
          filename: index.md

      - name: Assert index.md was created
        run: |
          if [ ! -f /tmp/wiki-test/index.md ]; then
            echo "FAIL: index.md was not created"
            exit 1
          fi
          echo "PASS: index.md exists"

      - name: Assert index.md contains document links
        run: |
          CONTENT=$(cat /tmp/wiki-test/index.md)
          echo "index.md content:"
          echo "$CONTENT"
          if ! echo "$CONTENT" | grep -q "page-one"; then
            echo "FAIL: index.md does not contain link to page-one.md"
            exit 1
          fi
          if ! echo "$CONTENT" | grep -q "page-two"; then
            echo "FAIL: index.md does not contain link to page-two.md"
            exit 1
          fi
          if ! echo "$CONTENT" | grep -q "page-three"; then
            echo "FAIL: index.md does not contain link to page-three.md"
            exit 1
          fi
          echo "PASS: index.md contains all document links"

      - name: Assert index.md has Documents section
        run: |
          CONTENT=$(cat /tmp/wiki-test/index.md)
          if ! echo "$CONTENT" | grep -q "## Documents"; then
            echo "FAIL: index.md does not have a Documents section"
            exit 1
          fi
          echo "PASS: index.md has Documents section"

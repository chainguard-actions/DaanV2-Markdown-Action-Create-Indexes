name: Test basic usage - create indexes
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up markdown folder structure
        run: |
          mkdir -p "$GITHUB_WORKSPACE/wiki/category-a"
          mkdir -p "$GITHUB_WORKSPACE/wiki/category-b"
          echo "# Page One" > "$GITHUB_WORKSPACE/wiki/category-a/page-one.md"
          echo "# Page Two" > "$GITHUB_WORKSPACE/wiki/category-a/page-two.md"
          echo "# Page Three" > "$GITHUB_WORKSPACE/wiki/category-b/page-three.md"

      - id: action
        uses: .
        with:
          folder: "${{ github.workspace }}/wiki"
          filename: index.md

      - name: Assert index.md created in category-a
        run: |
          if [ ! -f "$GITHUB_WORKSPACE/wiki/category-a/index.md" ]; then
            echo "FAIL: index.md not found in category-a"
            exit 1
          fi
          echo "PASS: index.md found in category-a"

      - name: Assert index.md created in category-b
        run: |
          if [ ! -f "$GITHUB_WORKSPACE/wiki/category-b/index.md" ]; then
            echo "FAIL: index.md not found in category-b"
            exit 1
          fi
          echo "PASS: index.md found in category-b"

      - name: Assert root index.md created (references subcategories)
        run: |
          if [ ! -f "$GITHUB_WORKSPACE/wiki/index.md" ]; then
            echo "FAIL: root index.md not found in wiki"
            exit 1
          fi
          echo "PASS: root index.md found in wiki"

      - name: Assert index.md contains document links
        run: |
          CONTENT=$(cat "$GITHUB_WORKSPACE/wiki/category-a/index.md")
          echo "Content of category-a/index.md:"
          echo "$CONTENT"
          if ! echo "$CONTENT" | grep -q "page-one"; then
            echo "FAIL: index.md does not contain link to page-one"
            exit 1
          fi
          if ! echo "$CONTENT" | grep -q "page-two"; then
            echo "FAIL: index.md does not contain link to page-two"
            exit 1
          fi
          echo "PASS: index.md contains expected document links"

      - name: Assert root index.md contains category links
        run: |
          CONTENT=$(cat "$GITHUB_WORKSPACE/wiki/index.md")
          echo "Content of wiki/index.md:"
          echo "$CONTENT"
          if ! echo "$CONTENT" | grep -q "category-a"; then
            echo "FAIL: root index.md does not contain link to category-a"
            exit 1
          fi
          if ! echo "$CONTENT" | grep -q "category-b"; then
            echo "FAIL: root index.md does not contain link to category-b"
            exit 1
          fi
          echo "PASS: root index.md contains expected category links"

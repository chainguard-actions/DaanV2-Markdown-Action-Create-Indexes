name: Test basic usage - create index
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create test markdown folder structure
        run: |
          mkdir -p /tmp/test-wiki
          echo "# Page One" > /tmp/test-wiki/page-one.md
          echo "# Page Two" > /tmp/test-wiki/page-two.md
          echo "# Page Three" > /tmp/test-wiki/page-three.md

      - id: action
        uses: .
        with:
          folder: /tmp/test-wiki
          filename: index.md

      - name: Assert index file was created
        run: |
          echo "Checking for index.md in /tmp/test-wiki"
          if [ ! -f "/tmp/test-wiki/index.md" ]; then
            echo "FAIL: index.md was not created"
            exit 1
          fi
          echo "PASS: index.md exists"

      - name: Assert index contains links to markdown files
        run: |
          echo "Contents of index.md:"
          cat /tmp/test-wiki/index.md
          if ! grep -q "page-one" /tmp/test-wiki/index.md; then
            echo "FAIL: index.md does not reference page-one.md"
            exit 1
          fi
          if ! grep -q "page-two" /tmp/test-wiki/index.md; then
            echo "FAIL: index.md does not reference page-two.md"
            exit 1
          fi
          if ! grep -q "page-three" /tmp/test-wiki/index.md; then
            echo "FAIL: index.md does not reference page-three.md"
            exit 1
          fi
          echo "PASS: index.md contains links to all markdown files"

name: Test basic index creation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up test wiki folder
        run: |
          mkdir -p "$GITHUB_WORKSPACE/wiki-test"
          echo "# Hello World" > "$GITHUB_WORKSPACE/wiki-test/hello.md"
          echo "# Goodbye World" > "$GITHUB_WORKSPACE/wiki-test/goodbye.md"

      - id: action
        uses: .
        with:
          folder: "${{ github.workspace }}/wiki-test"
          filename: index.md

      - name: Assert index.md was created
        run: |
          INDEX="$GITHUB_WORKSPACE/wiki-test/index.md"
          if [ ! -f "$INDEX" ]; then
            echo "FAIL: index.md was not created"
            exit 1
          fi
          echo "PASS: index.md exists"

      - name: Assert index.md contains document links
        run: |
          INDEX="$GITHUB_WORKSPACE/wiki-test/index.md"
          echo "--- index.md contents ---"
          cat "$INDEX"
          echo "--- end ---"
          if ! grep -q "hello" "$INDEX"; then
            echo "FAIL: index.md does not contain link to hello.md"
            exit 1
          fi
          if ! grep -q "goodbye" "$INDEX"; then
            echo "FAIL: index.md does not contain link to goodbye.md"
            exit 1
          fi
          echo "PASS: index.md contains expected document links"

      - name: Assert index.md has Documents section
        run: |
          INDEX="$GITHUB_WORKSPACE/wiki-test/index.md"
          if ! grep -q "## Documents" "$INDEX"; then
            echo "FAIL: index.md does not have a Documents section"
            exit 1
          fi
          echo "PASS: index.md has Documents section"
